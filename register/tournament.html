<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Registration - PlayBox Kashmir™</title>
<link rel="icon" type="image/png" href="../favicon.png">
<meta name="description" content="Register your team for a PlayBox Kashmir™ tournament.">
<link rel="stylesheet" href="../assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<style>
body.register-page{background:#f9fafb;min-height:100vh;}
.reg-hero{text-align:center;padding:3rem 1.5rem 1.5rem;}
.reg-hero h1{font-size:2rem;color:#111827;margin-bottom:0.5rem;}
.reg-hero p{color:#6b7280;}
.reg-container{max-width:900px;margin:0 auto;padding:0 1.5rem 4rem;}
.tourn-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem;}
.tourn-card{background:#fff;border-radius:14px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #eee;cursor:pointer;transition:transform .2s,box-shadow .2s;}
.tourn-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1);}
.tourn-card-badge{display:inline-block;font-size:0.7rem;font-weight:700;padding:4px 10px;border-radius:12px;margin-bottom:0.75rem;}
.tourn-card-badge.open{background:#e6f4ea;color:#15803d;}
.tourn-card-badge.invite_only{background:#fef3c7;color:#92400e;}
.tourn-card h3{font-size:1.15rem;margin-bottom:0.4rem;color:#111827;}
.tourn-card p{color:#6b7280;font-size:0.9rem;margin-bottom:0.3rem;}
.tourn-card .tourn-fee{font-weight:700;color:#15803d;margin-top:0.5rem;}
.reg-form-card{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #eee;}
.reg-form-card h2{margin-bottom:0.25rem;color:#111827;}
.reg-form-card .reg-form-sub{color:#6b7280;margin-bottom:1.5rem;font-size:0.9rem;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
.form-group-full{margin-bottom:1rem;}
.form-group-full label,.form-row label{display:block;font-size:0.85rem;font-weight:600;color:#374151;margin-bottom:0.35rem;}
.form-group-full input,.form-row input,.form-group-full select{width:100%;padding:0.6rem 0.75rem;border:1px solid #d1d5db;border-radius:8px;font-size:0.95rem;}
.player-row{display:grid;grid-template-columns:2fr 1fr;gap:0.75rem;margin-bottom:0.6rem;}
.player-row input{padding:0.55rem 0.7rem;border:1px solid #d1d5db;border-radius:8px;}
.eligibility-msg{display:none;margin:0.75rem 0;padding:0.75rem 1rem;border-radius:8px;font-size:0.9rem;}
.eligibility-msg.error{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;}
.eligibility-msg.success{display:block;background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.reg-fee-bar{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #e5e7eb;}
.reg-fee-bar .fee-amount{font-size:1.4rem;font-weight:800;color:#111827;}
.btn-pay-register{background:#15803d;color:#fff;border:none;padding:0.85rem 1.75rem;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;}
.btn-pay-register:disabled{opacity:0.55;cursor:not-allowed;}
.btn-back-step{background:none;border:none;color:#6b7280;font-weight:600;cursor:pointer;margin-bottom:1rem;}
.confirm-screen{text-align:center;padding:3rem 1.5rem;}
.confirm-screen i{font-size:3.5rem;color:#15803d;margin-bottom:1rem;}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;z-index:999;}
.agree-terms{display:flex;align-items:flex-start;gap:10px;margin:16px 0;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;font-size:14px;line-height:1.5;color:#374151;}
.agree-terms input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;cursor:pointer;accent-color:#15803d;}
.agree-terms a{color:#15803d;text-decoration:underline;}
</style>
</head>
<body class="register-page">

<nav class="navbar" id="navbar">
<div class="nav-container">
<a href="index.html" class="nav-logo">
<span class="logo-play">Play</span><span class="logo-box">Box</span>
<span class="logo-kashmir">Kashmir</span><span class="logo-tm">™</span>
</a>
<div class="nav-actions">
<a href="index.html" class="btn-back-home">
<i class="fas fa-arrow-left"></i> Back
</a>
</div>
</div>
</nav>

<div class="reg-hero">
<h1>Tournament Registration</h1>
<p>Pick a tournament below to register your team</p>
</div>

<div class="reg-container">

<div id="tournamentListSection">
<div class="tourn-cards" id="tournamentCards">
<p>Loading tournaments...</p>
</div>
</div>

<div id="registrationFormSection" style="display:none;">
<div class="reg-form-card">
<button class="btn-back-step" id="btnBackToList"><i class="fas fa-arrow-left"></i> Back to tournaments</button>
<h2 id="selectedTournamentName"></h2>
<p class="reg-form-sub" id="selectedTournamentSub"></p>

<div id="eligibilityMsg" class="eligibility-msg"></div>

<div class="form-row">
<div>
<label>Team Name</label>
<input type="text" id="reg_team_name">
</div>
<div>
<label>Captain Name</label>
<input type="text" id="reg_captain_name">
</div>
</div>
<div class="form-row">
<div>
<label>Contact Number</label>
<input type="tel" id="reg_contact_number">
</div>
<div>
<label>Email</label>
<input type="email" id="reg_email">
</div>
</div>

<div class="form-group-full">
<label>Players (Name & Jersey Number)</label>
<div id="playersContainer"></div>
</div>

<div class="agree-terms" id="agreeTermsBox">
<input type="checkbox" id="reg_agree_terms">
<label for="reg_agree_terms">I accept the <a href="../terms.html" target="_blank">Terms and Conditions</a> <span class="req">*</span></label>
</div>

<div class="reg-fee-bar">
<div>Entry Fee<br><span class="fee-amount" id="reg_entry_fee_display">₹0</span></div>
<button class="btn-pay-register" id="btnPayRegister">Pay & Register</button>
</div>
</div>
</div>

<div id="confirmationSection" style="display:none;">
<div class="confirm-screen">
<i class="fas fa-check-circle"></i>
<h2>Registration Confirmed!</h2>
<p>Your team has been registered. A confirmation email has been sent to your inbox.</p>
<a href="index.html" class="btn-back-home"><i class="fas fa-home"></i> Back to Home</a>
</div>
</div>

</div>

<div class="loading-overlay" id="loadingOverlay" style="display:none;">
<div style="text-align:center;">
<i class="fas fa-spinner fa-spin" style="font-size:2rem;color:#15803d;"></i>
<p id="loadingText" style="margin-top:0.75rem;color:#374151;">Processing...</p>
</div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="register.js"></script>
</body>
</html>
