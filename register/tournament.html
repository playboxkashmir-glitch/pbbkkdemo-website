<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Registration - PlayBox Kashmir™</title>
<link rel="icon" type="image/png" href="../favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="../favicon.png?v=2">
<link rel="apple-touch-icon" href="../favicon.png?v=2">
<link rel="canonical" href="https://register.playboxkashmir.com/tournament.html">
<meta name="description" content="Register your team for a PlayBox Kashmir™ tournament.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tournament Registration - PlayBox Kashmir™">
<meta property="og:description" content="Register your team for a PlayBox Kashmir™ tournament.">
<meta property="og:image" content="https://www.playboxkashmir.com/favicon.png">
<meta property="og:url" content="https://register.playboxkashmir.com/tournament.html">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/register.css">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"></noscript>
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"></noscript>
</head>
<body class="register-page">

<nav class="navbar" id="navbar">
<div class="nav-container">
<a href="index.html" class="nav-logo">
<span class="logo-play">Play</span><span class="logo-box">Box</span>
<span class="logo-kashmir">Kashmir</span><span class="logo-tm">™</span>
</a>
<div class="nav-actions">
<a href="index.html" class="btn-back-home">
<i class="fas fa-arrow-left"></i> Back
</a>
</div>
</div>
</nav>

<div class="reg-hero">
<h1>Tournament Registration</h1>
<p>Pick a tournament below to register your team</p>
</div>

<div class="reg-container">

<div id="tournamentListSection">
<div class="tourn-cards" id="tournamentCards">
<p>Loading tournaments...</p>
</div>
</div>

<div id="registrationFormSection" style="display:none;">
<div class="reg-form-card">
<button class="btn-back-step" id="btnBackToList"><i class="fas fa-arrow-left"></i> Back to tournaments</button>
<h2 id="selectedTournamentName"></h2>
<p class="reg-form-sub" id="selectedTournamentSub"></p>

<div id="eligibilityMsg" class="eligibility-msg"></div>

<div class="form-row">
<div>
<label>Team Name</label>
<input type="text" id="reg_team_name">
</div>
<div>
<label>Captain Name</label>
<input type="text" id="reg_captain_name">
</div>
</div>
<div class="form-row">
<div>
<label>Contact Number</label>
<input type="tel" id="reg_contact_number">
</div>
<div>
<label>Email</label>
<input type="email" id="reg_email">
</div>
</div>

<div class="form-group-full">
<label>Players (Name & Jersey Number)</label>
<div id="playersContainer"></div>
</div>

<div class="agree-terms" id="agreeTermsBox">
<input type="checkbox" id="reg_agree_terms">
<label for="reg_agree_terms">I accept the <a href="../terms.html" target="_blank">Terms and Conditions</a> <span class="req">*</span></label>
</div>

<div class="reg-fee-bar">
<div>Entry Fee<br><span class="fee-amount" id="reg_entry_fee_display">₹0</span></div>
<button class="btn-pay-register" id="btnPayRegister">Pay & Register</button>
</div>
</div>
</div>

<div id="confirmationSection" style="display:none;">
<div class="confirm-screen">
<i class="fas fa-check-circle"></i>
<h2>Registration Confirmed!</h2>
<p>Your team has been registered. A confirmation email has been sent to your inbox.</p>
<a href="index.html" class="btn-back-home"><i class="fas fa-home"></i> Back to Home</a>
</div>
</div>

</div>

<div class="loading-overlay" id="loadingOverlay" style="display:none;">
<div style="text-align:center;">
<i class="fas fa-spinner fa-spin" style="font-size:2rem;color:#15803d;"></i>
<p id="loadingText" style="margin-top:0.75rem;color:#374151;">Processing...</p>
</div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="register.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/consent-banner.js"></script>
</body>
</html>
